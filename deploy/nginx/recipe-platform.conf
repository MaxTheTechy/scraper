server {
    listen 80;
    server_name recipe-dev-01;

    # Management UI (built React static)
    location / {
        root /opt/scraper/ui/dist;
        try_files $uri /index.html;
    }

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Scraped images
    location /images/ {
        alias /data/images/;
    }
}
